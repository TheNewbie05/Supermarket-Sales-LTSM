apiVersion: apps/v1
kind: Deployment
metadata:
  name: sales-forecaster
spec:
  replicas: 2
  selector:
    matchLabels:
      app: forecaster
  template:
    metadata:
      labels:
        app: forecaster
    spec:
      containers:
      - name: forecaster
        image: sales-forecaster:latest
        ports:
        - containerPort: 8000